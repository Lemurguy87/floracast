services:
  jupyter:
    build: ./python_container
    command: start-notebook.sh --NotebookApp.token='' --NotebookApp.password=''
    env_file:
      - .env
    ports:
      - "${PYTHON_PORT}:8888"
    volumes:
      - ./notebooks:/home/jovyan/work
    depends_on:
      postgres_db:
        condition: service_healthy

  r_studio:
    build: ./r_loader
    environment:
      - DISABLE_AUTH=true
    env_file:
      - .env
    ports:
      - "${RSTUDIO_PORT}:8787"
    command: 
      - Rscript
      - /home/rstudio/ProcessCuratedMetagenomics.R
    depends_on:
      postgres_db:
        condition: service_healthy


  postgres_db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data 
      - ./init-db:/docker-entrypoint-initdb.d  
    healthcheck:
        test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} || exit 1"]
        interval: 10s
        timeout: 5s
        retries: 5
        start_period: 10s  

volumes:
  postgres_data:

